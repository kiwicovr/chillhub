<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChillHub</title>
  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
  <header class="bg-white shadow p-4 sticky top-0 z-10">
    <h1 class="text-2xl font-bold text-center text-indigo-600">ChillHub</h1>
  </header>

  <main class="max-w-xl mx-auto mt-6 px-4">
    <!-- Form di pubblicazione -->
    <div class="bg-white rounded-xl shadow p-4 mb-6">
      <h2 class="text-lg font-semibold mb-2">Crea un nuovo post</h2>
      <textarea id="postText" class="w-full border rounded p-2 mb-2" rows="3" placeholder="Scrivi qualcosa..."></textarea>
      <button onclick="createPost()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded w-full">Pubblica</button>
    </div>

    <!-- Feed dei post -->
    <div id="feed" class="space-y-4"></div>
  </main>

  <script>
    // Configurazione Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBjRHhzoHQQxQv2NPUn5dLFgI8F1Pixz9o",
      authDomain: "chillhub-2-0.firebaseapp.com",
      projectId: "chillhub-2-0",
    };

    // Inizializza Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Crea un nuovo post
    function createPost() {
      const text = document.getElementById("postText").value.trim();
      if (!text) return;

      db.collection("posts").add({
        text: text,
        timestamp: Date.now()
      }).then(() => {
        document.getElementById("postText").value = "";
        loadPosts();
      }).catch((error) => {
        console.error("Errore nel salvataggio del post:", error);
      });
    }

    // Carica tutti i post dal database
    function loadPosts() {
      const feed = document.getElementById("feed");
      feed.innerHTML = "";

      db.collection("posts").orderBy("timestamp", "desc").get().then((querySnapshot) => {
        querySnapshot.forEach((doc) => {
          const post = doc.data();
          const div = document.createElement("div");
          div.className = "bg-white rounded-xl shadow p-4 mb-4";
          div.textContent = post.text;
          feed.appendChild(div);
        });
      });
    }

    // Carica i post quando la pagina viene aperta
    window.onload = loadPosts;
  </script>
</body>
</html>
